services:
  app:
    build:
      context: .
      dockerfile: ./deploy/php-fpm/Dockerfile
    image: laravel-inertia-app
    container_name: plexor-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - laravel_storage:/var/www/storage
    networks:
      - plexor-network
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=plexorBG
      - DB_USERNAME=plexor
      - DB_PASSWORD=plexor

  web:
    image: nginx:alpine
    container_name: plexor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - plexor-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: plexor-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: plexorBG
      MYSQL_ROOT_PASSWORD: plexor
      MYSQL_USER: plexor
      MYSQL_PASSWORD: plexor
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - plexor-network

  vite:
    image: node:20-alpine
    container_name: plexor-vite
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - plexor-network

networks:
  plexor-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  laravel_storage:
    driver: local
